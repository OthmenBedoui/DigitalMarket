version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digitalmarket
      POSTGRES_PASSWORD: digitalmarket
      POSTGRES_DB: digitalmarket
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - ../apps/api/.env
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    env_file:
      - ../apps/web/.env.local
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
